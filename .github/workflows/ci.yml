name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_MYSQL_DSN: root:password@tcp(127.0.0.1:3306)/testdb?parseTime=true
      TEST_POSTGRES_DSN: postgres://postgres:password@127.0.0.1:5432/testdb?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache: false

      - name: Resource-stage tests (no host services)
        run: |
          python3 scripts/managed_resources/test-wsl-resources.py
          python3 scripts/managed_resources/test-wsl-resource-verification.py
          python3 scripts/managed_resources/test-resource-limited-runner.py

      - name: Check public test output boundary
        run: sh scripts/test-public-output-check.sh

      - name: Run tests
        run: sh scripts/test-public-output.sh

      - name: Check strict comparison input regressions
        run: python3 scripts/release_validation/check_strict_inputs.py

      - name: Database diagnostics omitted
        if: failure()
        run: |
          printf '%s\n' 'CI_DATABASE_DIAGNOSTICS_OMITTED: raw server logs may contain sensitive values'
